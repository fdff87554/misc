# ~/.tmux.conf — 需要 tmux 3.2 以上（Ubuntu 22.04+ / Debian 12+ / Kali / Homebrew）
# 來源：https://github.com/fdff87554/misc/blob/main/configs/tmux/.tmux.conf
# 搭配 Ghostty 與 misc/configs/vim/.vimrc；註解一律獨立成行

# 滑鼠：捲動、選取、切換 pane
set -g mouse on

# scrollback 上限（預設只有 2000 行）
set -g history-limit 50000

# Esc 不延遲（tmux 3.4 以前預設 500ms，vim 按 Esc 會卡）
set -sg escape-time 10

# 把終端機焦點事件傳給 vim，讓 autoread 在切回視窗時生效
set -g focus-events on

# copy-mode 使用 vi 按鍵
setw -g mode-keys vi

# 視窗與 pane 從 1 開始編號（對應鍵盤順序），關閉視窗後自動重新編號
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# True color：pane 內使用 tmux-256color，並告訴 tmux 外層 Ghostty 支援 RGB 與 OSC52 剪貼簿
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:clipboard"
# 讓 pane 內的程式（如 vim termguicolors）知道可用 true color
set-environment -g COLORTERM truecolor

# copy-mode 與 vim 的 OSC52 選取同步到系統剪貼簿（滑鼠拖曳放開即可在 Mac 貼上）
set -g set-clipboard on
